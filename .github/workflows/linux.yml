name: Linux (disabled)

# This built and published Linux releases (AppImage/.deb/.rpm) of the
# upstream coucou project. Fedo is a personal tool for one machine
# (FEDO.md §0) with no planned public releases, so the build-and-publish
# pipeline is disabled rather than adapted. Build locally instead:
#   cd app && npm install && npm run tauri dev

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI is not set up for this personal fork. Build locally: cd app && npm install && npm run tauri dev"
